# staticcheck 設定  https://staticcheck.dev/docs/configuration/
#
# checks: 有効にするチェック ID。"all" で全カテゴリ (SA/S1/ST1/QF/U1) を有効化し、
#         "-" 接頭辞で個別に除外する。ここを外していくスタイルが管理しやすい。
checks = [
  "all",
  # ST1000: パッケージコメント (// Package foo ...) の必須化。
  #         公開ライブラリなら有効にする価値があるが、main 中心のうちは煩いので除外。
  "-ST1000",
]

# ST1003 (命名規約) が「頭字語は全大文字 or 全小文字で揃える」と判定する語。
# ここに載っている語だけが userId → userID のように指摘される。
# プロジェクト固有の略語 (例: SPWN, VOD) を足すと効くようになる。
initialisms = [
  "ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP",
  "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL",
  "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI",
  "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS",
]

# ST1001: dot import (import . "pkg") を許可するパッケージ。空 = 全面禁止。
dot_import_whitelist = []

# ST1013: HTTP ステータスコードを数値リテラルのまま書いてよいもの。
# これ以外は http.StatusNotFound のような定数を使えと指摘される。
http_status_code_whitelist = ["200", "400", "404", "500"]
